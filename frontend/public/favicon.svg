<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FFDF00" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a" />
  
  <!-- Subtle Circular Emblem Backing Ring -->
  <circle cx="240" cy="235" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" />
  <circle cx="240" cy="235" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25" />

  <!-- Royal Crown -->
  <g transform="translate(230, 82) scale(0.95)" filter="url(#goldGlow)">
    <path d="M-60,35 L-80,-10 L-35,10 L0,-32 L35,10 L80,-10 L60,35 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels / Orbs -->
    <circle cx="-80" cy="-14" r="6" fill="url(#goldRadial)" />
    <circle cx="-35" cy="6" r="5" fill="url(#goldRadial)" />
    <circle cx="0" cy="-38" r="7.5" fill="url(#goldRadial)" />
    <circle cx="35" cy="6" r="5" fill="url(#goldRadial)" />
    <circle cx="80" cy="-14" r="6" fill="url(#goldRadial)" />
    <!-- Crown Base Band -->
    <rect x="-62" y="36" width="124" height="10" rx="4" fill="url(#goldGrad)" />
  </g>

  <!-- Calligraphic Monogram 'L' / 'C' Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Swirling Flourish Top Left -->
    <path d="M 170 185 C 190 145, 270 120, 355 142 C 320 152, 280 170, 255 198 C 235 220, 225 250, 230 280 C 235 310, 260 335, 290 345 C 330 358, 380 345, 410 325 C 370 360, 300 380, 245 365 C 200 353, 170 315, 175 265 C 180 220, 205 185, 245 160 C 275 142, 315 132, 355 132" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Main Calligraphic L Stem -->
    <path d="M 275 145 C 265 180, 255 240, 242 300 C 235 330, 225 350, 205 355 C 185 360, 165 340, 155 315 C 145 290, 150 260, 175 245 C 195 233, 220 238, 222 255 C 224 272, 205 285, 192 280 C 185 277, 182 268, 188 263" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Swooping Base Flourish -->
    <path d="M 205 355 C 250 360, 310 355, 360 330 C 390 315, 415 290, 420 270 C 410 285, 385 305, 350 320 C 305 340, 245 348, 205 345" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Elegant Brand Typography "Lucky Couture" -->
  <text x="256" y="445" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="42" 
        font-weight="700" 
        letter-spacing="3" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#goldGlow)">
    Lucky Couture
  </text>
</svg>